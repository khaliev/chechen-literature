<!doctype html>
<html lang="ce">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Нохчийн литература — Байташ, иллеш, проза" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:title" content="Нохчийн литература — Байташ, иллеш, проза" />
    <meta property="og:description" content="Нохчийн литература — Байташ, иллеш, проза" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ce" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=inter:400,500,600,700|noto-serif:400,700&display=swap"
      rel="stylesheet"
    />

    <title>Нохчийн литература — Байташ, иллеш, проза</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
